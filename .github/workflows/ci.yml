name: CI / Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-quality:
    name: Security & Quality Checks (Bandit, pip-audit, mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install audit & linter tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit mypy .

    - name: Run Bandit AST Security Linter
      run: |
        bandit -r src/ce3x_mcp -s B404,B603,B607 -ll

    - name: Run pip-audit for dependency vulnerabilities
      run: |
        pip-audit . --desc on

    - name: Run static type checking with mypy
      run: |
        mypy src/ce3x_mcp --ignore-missing-imports || true

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: security-and-quality
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install ifcopenshell

    - name: Run Unit & Integration Tests
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python tests/test_ce3x_mcp.py
